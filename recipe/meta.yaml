{% set name = "careamics" %}
{% set version = "0.0.16" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/careamics-{{ version }}.tar.gz
  sha256: 141950a0c0450e0bf598db589269ff0e911f8131e53f50fa46e74de0d169e07e

build:
noarch: python
script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
number: 0

requirements:
host:
- pip
- python {{ python_min }}
- hatchling
- hatch-vcs
run:
- python >={{ python_min }}
- numpy >=1.21
- pytorch >=2.0,<=2.8.0
- torchvision <=0.23.0
- bioimageio.core >=0.9.0
- tifffile <=2025.9.30
- psutil <=7.1.0
- pydantic >=2.11,<=2.12
- pytorch-lightning >=2.2,<=2.5.5
- pyyaml <=6.0.3,!=6.0.0
- typer >=0.12.3,<=0.19.2
- scikit-image <=0.25.2
- zarr >=3.0.0,<4.0.0
- pillow <=11.3.0
- matplotlib-base <=3.10.6
- validators <=0.35.0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - numpy <2.0.0
    - pytorch >=2.0,<=2.7.1
    - torchvision <=0.22.1
    - bioimageio.core ==0.9.0
    - tifffile <=2025.5.10
    - psutil <=7.0.0
    - pydantic >=2.11,<=2.12
    - pytorch-lightning >=2.2,<=2.5.2
    - pyyaml <=6.0.2,!=6.0.0
    - typer >=0.12.3,<=0.16.0
    - scikit-image <=0.25.2
    - zarr <3.0.0
    - pillow <=11.2.1
    - matplotlib-base <=3.10.3

test:
  imports:
    - careamics
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://careamics.github.io
  summary: Deep-learning library for running N2V and friends.
  description: |
    CAREamics is a PyTorch library aimed at simplifying the use of Noise2Void and its many 
    variants and cousins (CARE, Noise2Noise, N2V2, P(P)N2V, HDN, MicroSplit etc.).
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/CAREamics/careamics
  doc_url: https://careamics.github.io
  doc_source_url: https://github.com/CAREamics/careamics.github.io

extra:
  recipe-maintainers:
    - jdeschamps
