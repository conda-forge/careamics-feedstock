{% set name = "careamics" %}
{% set version = "0.0.22" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/careamics-{{ version }}.tar.gz
  sha256: 0d6730f065cffe8cd05878f96b20ec4a946694fb0a0e51311760b985eeae1782

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - numpy >=1.21.0
    - pytorch >=2.0,<=2.9.1
    - torchvision <=0.24.1
    - bioimageio.core >=0.9.0
    - tifffile <=2025.12.20
    - psutil <=7.2.1
    - pydantic >=2.11,<=2.12.5
    - pytorch-lightning >=2.2,<=2.6.0
    - pyyaml <=6.0.3,!=6.0.0
    - typer >=0.12.3,<=0.21.1
    - scikit-image <=0.26.0
    - zarr >=3.0.0,<4.0.0
    - pillow <=12.1.0
    - matplotlib-base <=3.10.8
    - validators <=0.35.0
    - torchmetrics >=0.11.0,<1.5.0

test:
  imports:
    - careamics
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://careamics.github.io
  summary: Deep-learning library for running N2V and friends.
  description: |
    CAREamics is a PyTorch library aimed at simplifying the use of Noise2Void and its many 
    variants and cousins (CARE, Noise2Noise, N2V2, P(P)N2V, HDN, MicroSplit etc.).
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/CAREamics/careamics
  doc_url: https://careamics.github.io
  doc_source_url: https://github.com/CAREamics/careamics.github.io

extra:
  recipe-maintainers:
    - jdeschamps
